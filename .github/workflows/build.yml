name: Iris-AutoBuild

on:
  schedule:
    - cron: '0 6 * * 0'  # 仅周日凌晨 6 点触发
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Upstream
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/Iris
          ref: master
          fetch-depth: 1

      - name: Check for Updates
        id: check_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE_SHA=$(git rev-parse HEAD)
          echo "REMOTE_SHA=$REMOTE_SHA" >> $GITHUB_ENV
          
          LAST_TAG=$(gh release list --limit 1 | awk '{print $1}' || echo "none")
          
          echo "Current Remote SHA: $REMOTE_SHA"
          echo "Last Release Tag: $LAST_TAG"

          if [[ "$LAST_TAG" == *"$REMOTE_SHA"* ]]; then
            echo "::notice::远程仓库无更新，跳过本次构建。"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.check_update.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get Build Info
        if: steps.check_update.outputs.should_build == 'true'
        id: vars
        run: |
          RAW_VERSION=$(grep "version =" build.gradle.kts | awk -F'"' '{print $2}')
          FULL_SHA=${{ env.REMOTE_SHA }}
          SHORT_SHA=$(echo $FULL_SHA | cut -c1-7)
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          echo "FULL_VERSION=${RAW_VERSION}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "FULL_SHA=${FULL_SHA}" >> $GITHUB_ENV
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV

      - name: Build with Gradle
        if: steps.check_update.outputs.should_build == 'true'
        run: |
          chmod +x gradlew
          ./gradlew iris --no-daemon

      - name: Verify & Prepare Artifact
        if: steps.check_update.outputs.should_build == 'true'
        id: prepare
        run: |
          cd build/
          ORIGINAL_JAR=$(ls Iris-*.jar | head -n 1)
          NEW_JAR="Iris-${{ env.FULL_VERSION }}.jar"
          mv "$ORIGINAL_JAR" "$NEW_JAR"
          
          SHA256_SUM=$(sha256sum "$NEW_JAR" | awk '{print $1}')
          echo "SHA256_SUM=$SHA256_SUM" >> $GITHUB_ENV
          echo "FINAL_JAR_PATH=build/$NEW_JAR" >> $GITHUB_ENV
          
          cat > ../release-notes.md <<EOF
          - **上游版本:** \`${{ env.FULL_VERSION }}\`
          - **构建时间:** \`${{ env.BUILD_TIME }}\`
          - **Commit SHA:** [${{ env.FULL_SHA }}](https://github.com/VolmitSoftware/Iris/commit/${{ env.FULL_SHA }})
          
          - **SHA256:** \`$SHA256_SUM\`
          EOF

      - name: Create Release
        if: steps.check_update.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.REMOTE_SHA }}"
          name: "Iris Master Build (${{ env.FULL_VERSION }})"
          body_path: release-notes.md
          files: ${{ env.FINAL_JAR_PATH }}
